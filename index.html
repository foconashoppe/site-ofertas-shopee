<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas do Dia - Shopee</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f5f5f5; color: #333; }
        
        header { background-color: #ee4d2d; color: white; text-align: center; padding: 20px; }
        header h1 { font-size: 1.8rem; }
        header p { font-size: 0.9rem; margin-top: 5px; opacity: 0.9; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 10px; }
        .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }

        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 12px; }
        .titulo { font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; height: 40px; overflow: hidden; }
        
        .precos { margin-bottom: 12px; }
        .preco-antigo { text-decoration: line-through; color: #888; font-size: 0.8rem; }
        .preco-promocional { color: #ee4d2d; font-size: 1.2rem; font-weight: bold; }
        .desconto { background: #ffe8e8; color: #ee4d2d; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; }

        .btn-comprar { display: block; width: 100%; background-color: #ee4d2d; color: white; text-align: center; padding: 10px 0; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-comprar:hover { background-color: #d73211; }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Menores Preços Shopee do Dia</h1>
        <p>Atualizado automaticamente todos os dias</p>
    </header>

    <div class="container">
        <div class="grid-produtos" id="grid-produtos">
            <!-- Os produtos serão carregados aqui -->
        </div>
    </div>

    <script>
        fetch('produtos.json')
            .then(response => response.json())
            .then(produtos => {
                const container = document.getElementById('grid-produtos');
                container.innerHTML = '';

                produtos.forEach(item => {
                    const htmlCard = `
                        <div class="card">
                            <img src="${item.imagem}" alt="${item.titulo}">
                            <div class="card-body">
                                <div class="titulo">${item.titulo}</div>
                                <div class="precos">
                                    <span class="preco-antigo">${item.preco_antigo}</span>
                                    <span class="desconto">${item.desconto}</span>
                                    <div class="preco-promocional">${item.preco_promocional}</div>
                                </div>
                                <a href="${item.link_afiliado}" target="_blank" class="btn-comprar">Ver na Shopee</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += htmlCard;
                });
            })
            .catch(erro => console.error('Erro ao carregar produtos:', erro));
    </script>
</body>
</html>
